name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra cú pháp
        run: node --check BYPASS_KING.user.js
      - name: Kiểm tra metadata và mã nguy hiểm
        run: |
          grep -q "// ==UserScript==" BYPASS_KING.user.js
          grep -q "// ==/UserScript==" BYPASS_KING.user.js
          grep -qE "^// @version +[0-9]+\.[0-9]+\.[0-9]+" BYPASS_KING.user.js
          ! grep -nE "\beval\(|new Function|document\.cookie|GM_xmlhttpRequest" BYPASS_KING.user.js
